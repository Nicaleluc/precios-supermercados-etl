[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "precios-supermercados-etl"
version = "0.1.0"
description = "Extract de catálogos/precios de supermercados argentinos (VTEX) -> SQL Server (D_Precio*) + comparador de canasta"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "requests",
    "pyodbc",
    "sqlalchemy",
    "beautifulsoup4",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["etl*", "config*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
